# E4B Full SFT - Oracle Teaching
# alignment-handbook style config for TRL SFTTrainer

# Model
model_name_or_path: google/gemma-4-E4B-it
torch_dtype: bfloat16

# Data
dataset_path: /home/sdh/Bayesian-teaching-Gemma-4-E4B/data/train/oracle.jsonl
max_seq_length: 1024
preprocessing_num_workers: 12

# Training
bf16: true
deepspeed: configs/ds_zero3_config.json
chat_template_path: configs/gemma4_e4b_training_chat_template.jinja
do_eval: false
gradient_accumulation_steps: 20
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 2.0e-6
log_level: info
logging_steps: 10
logging_strategy: steps
lr_scheduler_type: cosine
num_train_epochs: 1
output_dir: /home/sdh/Bayesian-teaching-Gemma-4-E4B/models/e4b-full-oracle
overwrite_output_dir: true
per_device_train_batch_size: 1
assistant_only_loss: true
freeze_embeddings: true
save_strategy: steps
save_steps: 200
save_total_limit: 3
seed: 42
warmup_ratio: 0.1
report_to: none
